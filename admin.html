<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - سب نام بدلیں</title>
<style>
body{font-family:system-ui;background:#04231c;color:#fff6dc;padding:16px;max-width:600px;margin:auto}
h2{text-align:center;color:#e6c36a}
h3{color:#e6c36a;margin:22px 0 0;border-bottom:1px solid #e6c36a;padding-bottom:5px}
label{display:block;margin:12px 0 4px;font-weight:700;font-size:14px}
input,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #e6c36a;background:#fff;color:#111;font-size:15px;box-sizing:border-box;font-family:inherit}
button{width:100%;padding:13px;margin-top:12px;border:0;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer}
.save{background:#e6c36a;color:#000}.back{background:#333;color:#fff}.reset{background:#b00020;color:#fff}
</style></head>
<body>
<h2>⚙️ Admin Panel - سب کچھ بدلیں</h2>
<p style="text-align:center;font-size:13px">Password: 1234</p>

<h3>🏠 Main</h3>
<label>Heading - ادارہ کا نام</label><input id="title">
<label>تاریخ - Date Line</label><input id="date">
<label>Voice File</label><input id="audio" dir="ltr">

<h3>🌸 زیر صدارت و نقابت</h3>
<label>زیر صدارت - نام</label><input id="sadarat">
<label>نقابت - نام</label><input id="naqabat">

<h3>💐 مہمانان گرامی</h3>
<label>مہمان 1</label><input id="m1">
<label>مہمان 2</label><input id="m2">
<label>مہمان 3</label><input id="m3">
<label>مہمان 4</label><input id="m4">

<h3>🎓 اساتذہ</h3>
<label>استاد 1</label><input id="u1">
<label>استاد 2</label><input id="u2">
<label>استاد 3</label><input id="u3">

<h3>🎤 خطاب</h3>
<label>خطاب 1</label><textarea id="k1" rows="2"></textarea>
<label>خصوصی خطاب 2</label><textarea id="k2" rows="2"></textarea>

<h3>📞 Footer / رابطہ</h3>
<label>مدیرہ کا نام</label><input id="foot">
<label>Phone 1</label><input id="ph1" dir="ltr">
<label>Phone 2</label><input id="ph2" dir="ltr">

<button class="save" onclick="saveAll()">✅ Save - محفوظ کریں</button>
<button class="reset" onclick="resetAll()">🔄 Reset</button>
<button class="back" onclick="location.href='index.html'">🏠 Wapas Home</button>

<script>
var keys=['title','date','audio','sadarat','naqabat','m1','m2','m3','m4','u1','u2','u3','k1','k2','foot','ph1','ph2'];
var def={'title':'ادارہ اصلاح البنات المسلمین','date':'29 نومبر 2026 - بروز اتوار - صبح 10 سے 3 بجے تک','audio':'audio6.mp3','sadarat':'محترمہ ام عبداللہ صاحبہ','naqabat':'محترمہ حافظہ بیگم محمد شوکت صاحبہ','m1':'محترمہ ام صدیق الرحمن صاحبہ','m2':'محترمہ بیگم حافظ محمد عمار صاحبہ','m3':'محترمہ مسز خان بہادر صاحبہ','m4':'محترمہ بیگم رحمت اللہ صاحبہ','u1':'محترمہ مسز محمد احمد صاحبہ','u2':'محترمہ میاں بیگم محمد معاذ صاحبہ','u3':'محترمہ ام محمد صاحبہ','k1':'محترمہ واعظہ خوش الحان باجی جان رضیہ ادریس صاحبہ','k2':'عظیم معلمہ باجی جان سدرہ عروج صاحبہ','foot':'ام معاذ بیگم قاری محمد رفیق','ph1':'0305 4940552','ph2':'0305 4531595'};
var p=prompt('Admin Password:'); if(p!=='1234'){alert('Galat Password!'); location.href='index.html';}
function load(){keys.forEach(function(k){document.getElementById(k).value=localStorage.getItem(k)||def[k]});}
function saveAll(){keys.forEach(function(k){localStorage.setItem(k,document.getElementById(k).value)}); alert('✅ Save ho gaya! Ab Home pe dekho');}
function resetAll(){localStorage.clear(); load(); alert('Reset ho gaya');}
load();
</script>
</body>
</html>
