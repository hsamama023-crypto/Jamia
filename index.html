<style>
:root{--em:#0B4A35;--em2:#04291D;--gold:#D4A62A;--gl:#F7E2A0;--bg:#FFF8E6;--card:#FFFFFF;--ink:#14231c;--mute:#4f5f57;--line:#EBD98F;--head:#0B4A35;--rose:#C2456F;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#06201A;--card:#0C3226;--ink:#F3ECD2;--mute:#B7C2B8;--line:#2A5A46;--head:#F1D98B}}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Nastaliq Urdu','Amiri',serif;background:var(--bg);color:var(--ink);direction:rtl;overflow-x:hidden;line-height:2.1}
button{font-family:inherit;cursor:pointer;border:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hero{position:relative;background:radial-gradient(ellipse at 50% 25%,#23996d 0%,#0f5a40 42%,var(--em2) 100%);color:#fff;padding:12px 16px 56px;text-align:center;overflow:hidden;border-radius:0 0 44px 44px}

<div class="wrap">
<div class="sec"><div class="tl"><h2>ادارے کا تعارف</h2><i></i></div>
<div class="card" style="display:flex;gap:14px;align-items:center"><div style="width:72px;height:72px;border-radius:50%;background:#0B4A35;color:#F7E2A0;display:flex;align-items:center;justify-content:center;font-size:32px;flex-shrink:0;border:3px solid var(--gold)">🕌</div><div><h3 id="madName" style="font-size:19px;color:var(--head);line-height:1.9">ادارہ اصلاح بنات المسلمین</h3><p id="madDesc" style="font-size:14px;line-height:2;color:var(--mute)">بچیوں اور خواتین کے لیے دینی تعلیم کا ادارہ۔ ناظرہ قرآن، تجوید، ترجمہ تفسیر اور حدیث کی تعلیم - پردے کے مکمل انتظام کے ساتھ۔</p><p style="color:#0B4A35;font-weight:700;font-size:14px">📍 جلیل ٹاؤن، گلی نمبر ۱۱، چندا قلعہ، گوجرانوالہ</p></div></div></div>

<div class="sec"><div class="tl"><h2>📚 شعبہ جات</h2><i></i></div><div style="display:flex;flex-wrap:wrap;gap:8px"><span style="background:var(--card);border:1px solid var(--gold);padding:8px 12px;border-radius:20px;font-size:14px;font-weight:700">📖 ناظرہ القرآن</span><span style="background:var(--card);border:1px solid var(--gold);padding:8px 12px;border-radius:20px;font-size:14px;font-weight:700">🎙️ تجوید و قراءت</span><span style="background:var(--card);border:1px solid var(--gold);padding:8px 12px;border-radius:20px;font-size:14px;font-weight:700">📜 ترجمہ تفسیر</span><span style="background:var(--card);border:1px solid var(--gold);padding:8px 12px;border-radius:20px;font-size:14px;font-weight:700">📚 حدیث نبوی ﷺ</span></div><p style="font-size:13px;color:var(--mute);margin-top:8px">تمام کلاسز بعد اذان عصر ہوتی ہیں - داخلہ جاری ہے</p></div>

<div class="sec" id="audioSec"><div class="tl"><h2>🎙️ آڈیو</h2><i></i></div>
<div class="card" style="text-align:center"><h3 id="audioTitle">🎙️ نعت شریف - ادارہ اصلاح بنات المسلمین</h3><audio id="mainAudio" controls src="audioo.mp3" style="width:100%;margin-top:10px"></audio><p style="font-size:12px;color:var(--mute)">اگر آڈیو نہ چلے تو چیک کریں کہ audioo.mp3 فائل موجود ہے</p></div></div>

<div class="sec"><div class="tl"><h2>📋 پروگرام - ۲۹ نومبر</h2><i></i></div><div id="progList" style="display:flex;flex-direction:column;gap:10px"></div></div>

<div class="sec"><div class="tl"><h2>🌟 مہمان خصوصی</h2><i></i></div><div class="gg" id="guestList"></div></div>

<div class="sec"><div class="tl"><h2>📍 لوکیشن و رابطہ</h2><i></i></div>
<div class="lc"><h3 id="locTitle">ادارہ اصلاح بنات المسلمین</h3><p id="locDesc"></p>
<div style="display:flex;gap:10px;margin-top:12px"><a id="mapLink" href="https://maps.google.com/?q=Jalil+Town+Chanda+Qila+Gujranwala" target="_blank" style="flex:1;text-align:center;text-decoration:none;padding:12px;border-radius:12px;font-weight:700;font-size:14px;background:#D4A62A;color:#222">📍 گوگل میپ کھولو</a><a id="callLink" href="tel:03054940552" style="flex:1;text-align:center;text-decoration:none;padding:12px;border-radius:12px;font-weight:700;font-size:14px;background:#fff;color:#0B4A35">📞 کال کرو</a></div></div></div>

<div class="sec"><div class="tl"><h2>💚 تعاون</h2><i></i></div>
<div class="don"><h3>ادارے کے لیے تعاون کریں</h3><p>آپ کے تعاون سے بچیوں کی تعلیم، کتابیں اور نئے ادارے کی تعمیر ہوتی ہے۔ اللہ آپ کو جزائے خیر دے۔</p><p style="font-weight:800;color:#0B4A35;margin-top:10px">جاز کیش / ایزی پیسہ:<br><span id="accountText" style="font-size:18px">0305-4940552 - مدیرہ ادارہ</span></p><button style="background:#0B4A35;color:#fff;border:none;padding:10px 18px;border-radius:20px;font-weight:700;margin-top:10px;cursor:pointer" onclick="copyAcc()">📋 نمبر کاپی کرو</button></div></div>

<div class="sec" id="inviteSec" style="display:none"><div class="tl"><h2>💌 دعوت نامہ</h2><i></i></div>
<div class="inv"><div style="font-family:'Amiri',serif;font-size:26px;color:#D4A62A">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div><p>السلام علیکم ورحمتہ اللہ وبرکاتہ</p><h2 id="invTitle">افتتاحی پروگرام</h2><h3 id="invMad">ادارہ اصلاح بنات المسلمین</h3><p id="invDesc">آپ کو دل کی گہرائیوں سے دعوت دی جاتی ہے۔ تشریف لا کر ثواب دارین حاصل کریں اور نئے ادارے کے لیے دعا فرمائیں۔</p><p style="font-weight:800;color:#0B4A35" id="invDate">📅 ۲۹ نومبر ۲۰۲۶ • اتوار • صبح ۱۰ تا ۳ بجے</p><p>📍 جلیل ٹاؤن، گلی ۱۱، چندا قلعہ، گوجرانوالہ<br>🌸 خواتین کے لیے الگ پردے کا انتظام<br>🍽️ ضیافت کا معقول انتظام ہوگا</p><button style="background:#0B4A35;color:#fff;border:none;padding:10px 18px;border-radius:20px;font-weight:700;margin-top:10px;cursor:pointer" onclick="shareWA()">📲 یہ دعوت واٹس ایپ پر بھیجو</button></div></div>

<div style="text-align:center;padding:20px;font-size:13px;color:#888;line-height:2">دین کے لیے محبت سے بنایا گیا • ادارہ اصلاح بنات المسلمین • گوجرانوالہ<br><span style="color:#D4A62A">✦ اللہ اس جلسے کو قبول فرمائے - آمین ✦</span></div></div>

<div class="fb"><button style="background:#fff;color:#0B4A35" onclick="showInvite()">💌 دعوت</button><button style="background:#25D366;color:#fff" onclick="shareWA()">واٹس ایپ</button><button style="background:#D4A62A;color:#222" onclick="openMap()">📍 لوکیشن</button></div>

<script>
let DEF={madName:"ادارہ اصلاح بنات المسلمین",heroTitle:"افتتاحی جلسہ",heroDesc:"اللہ کے فضل سے ہمارے نئے ادارے کا افتتاحی پروگرام ہونے جا رہا ہے۔ بچیوں اور خواتین کے لیے دینی تعلیم کا یہ نیا مرکز - آپ سب کو دل سے دعوت ہے۔ ضرور تشریف لائیں۔",date:"2026-11-29T10:00",dateLine:"📅 ۲۹ نومبر ۲۰۲۶ • اتوار • صبح ۱۰ بجے سے ۳ بجے تک",madDesc:"بچیوں اور خواتین کے لیے دینی تعلیم کا ادارہ۔ ناظرہ قرآن، تجوید، ترجمہ تفسیر اور حدیث کی تعلیم - پردے کے مکمل انتظام کے ساتھ۔",phone:"0305-4940552 / 0305-4531595",loc:"جلیل ٹاؤن، گلی نمبر ۱۱، چندا قلعہ، گوجرانوالہ",map:"https://maps.google.com/?q=Jalil+Town+Chanda+Qila+Gujranwala",account:"0305-4940552 - مدیرہ ادارہ",prog:"10:00 AM | تلاوت قرآن | بچیوں کی طرف سے تلاوت کلام پاک\n10:30 AM | نعت شریف | محفل نعت - خواتین\n11:30 AM | افتتاحی بیان | خصوصی بیان - مہمان خصوصی\n1:00 PM | دعائے خیر | ادارے کے لیے اجتماعی دعا\n2:00 PM | ضیافت | ضیافت کا معقول انتظام",guests:"محترمہ ام عبداللہ صاحبہ | مہمان خصوصی | جلیل ٹاؤن\nمحترمہ بیگم محمد شعیب صاحبہ | مہمان خصوصی | خصوصی شرکت\nمحترمہ ام صدیق احمد صاحبہ | مہمان خصوصی | بیان\nمحترمہ خوش بخت | خصوصی خطاب | بیان\nمحترمہ عائشہ صدیقہ | معلمہ | ادارہ",pass:"1234",audioName:"audioo.mp3",audioOn:"on",audioTitle:"🎙️ نعت شریف - ادارہ اصلاح بنات المسلمین"};
let KEYS=['madrasaFinalUrdu','madrasaUrduFinal','madrasaFinal','madrasaData'];
function loadS(){let out={};for(let k of KEYS){try{let v=JSON.parse(localStorage.getItem(k)||'{}');out={...out,...v};}catch(e){}}return out;}
let S=loadS();
function get(k){return S[k]!==undefined&&S[k]!==""?S[k]:DEF[k]}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function apply(){
document.getElementById('topName').textContent=get('madName');
document.getElementById('heroUrduName').textContent=get('madName');
document.getElementById('madName').textContent=get('madName');
document.getElementById('heroTitle').textContent=get('heroTitle');
document.getElementById('heroDesc').textContent=get('heroDesc');
document.getElementById('dateLine').textContent=get('dateLine');
document.getElementById('madDesc').textContent=get('madDesc');
document.getElementById('phoneText').textContent=get('phone');
document.getElementById('locDesc').innerHTML=esc(get('loc'))+"<br>📞 <span>"+esc(get('phone'))+"</span><br>🕙 جلسہ: صبح ۱۰ بجے سے ۳ بجے تک<br>🌸 خواتین کے لیے الگ انتظام ہے";
document.getElementById('locTitle').textContent=get('madName');
document.getElementById('accountText').textContent=get('account');
document.getElementById('mapLink').href=get('map');
document.getElementById('callLink').href="tel:"+get('phone').split('/')[0].trim().replace(/[^0-9+]/g,'');
document.getElementById('invTitle').textContent=get('heroTitle');
document.getElementById('invMad').textContent=get('madName');
document.getElementById('invDate').textContent=get('dateLine');
document.getElementById('audioTitle').textContent=get('audioTitle');
let aud=document.getElementById('mainAudio');aud.src=get('audioName');if(get('audioOn')==='off'){document.getElementById('audioSec').style.display='none';}
let prog=get('prog').split('\n').filter(x=>x.trim());
document.getElementById('progList').innerHTML=prog.map(l=>{let p=l.split('|');return `<div class="pi"><div class="tm"><b>${esc((p[0]||'').trim())}</b></div><div><h4>${esc((p[1]||'').trim())}</h4><p>${esc((p[2]||'').trim())}</p></div></div>`}).join('');
let guests=get('guests').split('\n').filter(x=>x.trim());
document.getElementById('guestList').innerHTML=guests.map(l=>{let p=l.split('|');let nm=(p[0]||'').trim();return `<div class="g"><div class="av">${esc(nm.replace('محترمہ','').trim().charAt(0)||'م')}</div><h4>${esc(nm)}</h4><p>${esc((p[1]||'').trim())}</p><span>${esc((p[2]||'').trim())}</span></div>`}).join('');
}
function tick(){let diff=new Date(get('date')).getTime()-Date.now();if(diff<0)diff=0;let d=Math.floor(diff/86400000),h=Math.floor(diff%86400000/3600000),m=Math.floor(diff%3600000/60000),s=Math.floor(diff%60000/1000);document.getElementById('cD').textContent=String(d).padStart(2,'0');document.getElementById('cH').textContent=String(h).padStart(2,'0');document.getElementById('cM').textContent=String(m).padStart(2,'0');document.getElementById('cS').textContent=String(s).padStart(2,'0');}
setInterval(tick,1000);tick();apply();
function showInvite(){let el=document.getElementById('inviteSec');el.style.display=el.style.display==='none'?'block':'none';if(el.style.display==='block')el.scrollIntoView({behavior:'smooth'});}
function openMap(){window.open(get('map'),'_blank');}
function copyAcc(){if(navigator.clipboard){navigator.clipboard.writeText(get('account')).then(()=>alert('کاپی ہو گیا! '+get('account')));}else{alert(get('account'));}}
function shareWA(){let msg="🕌 *"+get('madName')+"*%0A%0A✦ *"+get('heroTitle')+"* ✦%0A%0A"+encodeURIComponent(get('heroDesc'))+"%0A%0A"+encodeURIComponent(get('dateLine'))+"%0A📍 "+encodeURIComponent(get('loc'))+"%0A📞 "+get('phone')+"%0A%0Aآپ کو دل سے دعوت ہے۔ ضرور تشریف لائیں!%0A%0A"+encodeURIComponent(location.href);window.open('https://wa.me/?text='+msg,'_blank');}
function goAdmin(){window.location.href='admin.html';}
</script>
